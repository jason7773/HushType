name: build

# 推到 main 時，若 hushtype/__init__.py 的版本號還沒有對應的 Release，就自動建立 Release；
# 否則只打包成 Actions artifact。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test
        run: python -m pytest -q -rs
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path hushtype/__init__.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          $release = "false"
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $release = "true" }
          }
          if ($release -eq "false") { $v = "$v-dev.$env:GITHUB_RUN_NUMBER" }
          $global:LASTEXITCODE = 0
          "value=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ steps.version.outputs.value }}"
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Size report
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\Hushtype -Recurse -File
          "程式資料夾：{0:N1} MB，{1} 個檔案" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count
          Get-ChildItem dist\*-setup-*.exe | ForEach-Object { "{0}：{1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $files | Sort-Object Length -Descending | Select-Object -First 30 |
            ForEach-Object { "{0,8:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path dist\Hushtype).Path.Length + 1) }

      - uses: actions/upload-artifact@v4
        with:
          name: Hushtype-setup-${{ steps.version.outputs.value }}
          path: dist/Hushtype-setup-*.exe

      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Hushtype ${{ steps.version.outputs.value }}
          files: dist/*-setup-*.exe
          generate_release_notes: true
