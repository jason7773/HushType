name: build

# 推到 main 時，若 dictate/__init__.py 的版本號還沒有對應的 Release，就自動建立 Release；
# 否則只打包成 Actions artifact。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path dictate/__init__.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          $release = "false"
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $release = "true" }
          }
          if ($release -eq "false") { $v = "$v-dev.$env:GITHUB_RUN_NUMBER" }
          $global:LASTEXITCODE = 0
          "value=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ steps.version.outputs.value }}"
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-setup-${{ steps.version.outputs.value }}
          path: dist/dictate-setup-*.exe

      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: dictate ${{ steps.version.outputs.value }}
          files: dist/dictate-setup-*.exe
          generate_release_notes: true
